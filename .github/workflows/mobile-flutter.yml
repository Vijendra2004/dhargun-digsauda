# ==========================================================================================
# Repository   : Digital Sauda (Mobile)
# Stack        : Flutter (Android)
# Purpose      : Application CI/CD caller workflow
#
# Consumes:
#   - awl-common-validation.yml
#   - reusable-build-flutter-android.yml
#
# Mobile deployment:
#   - Artifact publishing
#   - Optional Firebase App Distribution
#
# Environment mapping:
#   develop    -> DEV
#   qa         -> UAT
#   uat        -> UAT
#   release/*  -> STAGING
#   main       -> PROD
#
# Flutter:
#   Version = 3.38.4
#
# Android:
#   Flavor / target are determined from branch.
# ==========================================================================================

name: Digital Sauda Mobile - CI/CD

on:

  workflow_dispatch:

  # Enable later when branch-based CI is required
  #
  # pull_request:
  #   branches: [develop, qa, uat, "release/*", main]
  #
  # push:
  #   branches: [develop, qa, uat, "release/*", main]

permissions:
  contents: read

concurrency:
  group: digital-sauda-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ========================================================================================
  # 1. DETERMINE ENVIRONMENT
  # ========================================================================================

  determine-environment:

    name: Determine Environment

    if: github.event_name != 'pull_request'

    runs-on: windows-latest

    outputs:
      environment: ${{ steps.map.outputs.environment }}
      flavor: ${{ steps.map.outputs.flavor }}
      target: ${{ steps.map.outputs.target }}

    steps:

      - name: Map Branch to Environment
        id: map
        shell: bash

        run: |

          case "${GITHUB_REF_NAME}" in

            develop)
              echo "environment=DEV" >> "$GITHUB_OUTPUT"
              echo "flavor=develop" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_dev.dart" >> "$GITHUB_OUTPUT"
              ;;

            qa)
              echo "environment=UAT" >> "$GITHUB_OUTPUT"
              echo "flavor=qa" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_qa.dart" >> "$GITHUB_OUTPUT"
              ;;

            uat)
              echo "environment=UAT" >> "$GITHUB_OUTPUT"
              echo "flavor=uat" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_uat.dart" >> "$GITHUB_OUTPUT"
              ;;

            release/*)
              echo "environment=STAGING" >> "$GITHUB_OUTPUT"
              echo "flavor=uat" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_uat.dart" >> "$GITHUB_OUTPUT"
              ;;

            main)
              echo "environment=PROD" >> "$GITHUB_OUTPUT"
              echo "flavor=uat" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_uat.dart" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "environment=DEV" >> "$GITHUB_OUTPUT"
              echo "flavor=develop" >> "$GITHUB_OUTPUT"
              echo "target=lib/main_dev.dart" >> "$GITHUB_OUTPUT"
              ;;

          esac

  # ========================================================================================
  # 2. COMMON VALIDATION
  # ========================================================================================

  validate:

    name: Common Validation

    needs: [determine-environment]

    if: always() && !failure()

    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/awl-common-validation.yml@main

    with:
      environment: ${{ needs.determine-environment.outputs.environment || 'DEV' }}

  # ========================================================================================
  # 3. BUILD FLUTTER ANDROID
  # ========================================================================================

  build:

    name: Build Flutter Android

    needs: [determine-environment, validate]

    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/reusable-build-flutter-android.yml@main

    with:

      working-directory: "adaniwilmar"

      flutter-version: "3.38.4"

      java-version: "21"

      build-type: "appbundle"

      build-mode: "release"

      environment: ${{ needs.determine-environment.outputs.environment }}

      flavor: ${{ needs.determine-environment.outputs.flavor }}

      target: ${{ needs.determine-environment.outputs.target }}

      artifact-name: digital-sauda-mobile-${{ github.run_number }}

    secrets:

      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}

  # ========================================================================================
  # 4. SECURITY SCAN
  # ========================================================================================

  security-scan:

    name: Security Scan (GitHub Advanced Security)

    needs: [build]

    runs-on: windows-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      # Dependency Review is PR-time only
      - name: Dependency Review
        if: github.event_name == 'pull_request'

        uses: actions/dependency-review-action@v4

        with:
          fail-on-severity: high

      # Secret scanning + push protection are GitHub-native
      # and should be enabled at organization/repository level.

  # ========================================================================================
  # 5. FIREBASE APP DISTRIBUTION
  # ========================================================================================

  distribute:

    name: Distribute Build (Firebase App Distribution)

    needs:
      - determine-environment
      - security-scan
      - build

    if: >
      github.event_name == 'push' &&
      needs.determine-environment.outputs.environment != 'PROD'

    runs-on: windows-latest

    environment:
      name: ${{ needs.determine-environment.outputs.environment }}

    steps:

      - name: Download Artifact

        uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/actions/awl-download-artifact@main

        with:
          artifact-name: digital-sauda-mobile-${{ github.run_number }}
          download-path: artifact

      - name: Firebase App Distribution

        uses: wzieba/Firebase-Distribution-Github-Action@v1

        with:

          appId: ${{ vars.FIREBASE_APP_ID }}

          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          groups: testers

          file: artifact/app-release.aab